<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://*.supabase.co; style-src 'self' 'unsafe-inline'; script-src 'self' cordova.js; connect-src 'self' https://*.supabase.co;" />
  <title>Math2048</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/board.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div id="app">
    <header id="hud" class="hud">
      <h1 class="hud__title" data-i18n="hud.title">Math2048</h1>
      <div class="hud__stats">
        <div class="hud__stat">
          <span class="hud__stat-label" data-i18n="hud.scoreLabel">Pontos</span>
          <span id="score-value" class="hud__stat-value">0</span>
        </div>
        <div class="hud__stat hud__stat--record">
          <span class="hud__stat-label" data-i18n="hud.recordLabel">Recorde</span>
          <span id="record-value" class="hud__stat-value">0</span>
        </div>
      </div>
      <div id="hud-user" class="hud__user" hidden></div>
      <button id="leaderboard-btn" class="btn btn--secondary" data-i18n="hud.btnRanking">Ranking</button>
      <button id="auth-btn" class="btn btn--secondary" data-i18n="hud.btnLogin">Entrar</button>
      <button id="new-game-btn" class="btn btn--secondary" data-i18n="hud.btnNewGame">Novo jogo</button>
    </header>

    <main id="board-container" class="board-container" aria-label="Tabuleiro do jogo">
      <div id="board" class="board"></div>
    </main>

    <footer class="footer">
      <p data-i18n="footer.hint">Junte os números e chegue ao bloco 2048! Use as setas ou deslize para mover os blocos.</p>
    </footer>
  </div>

  <div id="equation-modal" class="modal" hidden></div>
  <div id="game-over-modal" class="modal" hidden></div>
  <div id="win-modal" class="modal" hidden></div>
  <div id="auth-screen" class="modal" hidden></div>
  <div id="leaderboard-screen" class="modal" hidden></div>

  <script src="cordova.js"></script>
  <script src="dist/bundle.js"></script>
</body>
</html>
