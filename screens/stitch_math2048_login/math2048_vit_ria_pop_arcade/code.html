<style>

<!-- Placar Principal Neo-Brutalista (Card Amarelo) -->
<div class="w-full bg-arcade-yellow border-[3px] border-black rounded-2xl shadow-neo p-3 mb-3 text-black text-left flex items-center justify-between">
<div class="flex items-center gap-2.5">
<div class="w-10 h-10 bg-black text-arcade-yellow rounded-xl border-2 border-black flex items-center justify-center">

</div>
<div>

<button class="w-full bg-arcade-cyan text-black border-[3px] border-black py-3 rounded-2xl font-fredoka font-black text-sm uppercase tracking-wider shadow-neo hover:brightness-105 active:translate-x-1 active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2">

</button>
</div>
</div>
</main>
<!-- Barra de Navegação Inferior Neo-Brutalista Pop -->
<nav class="fixed bottom-0 left-0 w-full z-40 px-3 py-2 bg-[#1b1033] border-t-4 border-black flex justify-around items-center">
<button class="flex items-center gap-2 bg-arcade-yellow text-black border-2 border-black px-4 py-1.5 rounded-xl shadow-neo-sm font-fredoka font-black text-xs uppercase active:scale-95 transition-all">

<span class="material-symbols-outlined text-2xl">account_circle</span>

</button>

<script>
  // Confetes Geométricos Neo-Brutalistas / Pop Art
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  window.addEventListener('resize', resize);
  resize();

  const popColors = ['#FFE600', '#00F0FF', '#FF3385', '#39FF88', '#FF7A00', '#FFFFFF'];

  class PopParticle {
    constructor() {
      this.reset();
      this.y = Math.random() * canvas.height;
    }

    reset() {
      this.x = Math.random() * canvas.width;
      this.y = -30;
      this.size = Math.random() * 12 + 8;
      this.speed = Math.random() * 3 + 2;
      this.color = popColors[Math.floor(Math.random() * popColors.length)];
      this.angle = Math.random() * Math.PI * 2;
      this.spin = Math.random() * 0.15 - 0.075;
      this.shape = Math.floor(Math.random() * 3); // 0: rect, 1: circle, 2: strip
    }

    update() {
      this.y += this.speed;
      this.angle += this.spin;
      if (this.y > canvas.height + 40) {
        this.reset();
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.fillStyle = this.color;
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;

      if (this.shape === 0) {
        // Retângulo com borda preta
        ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
        ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
      } else if (this.shape === 1) {
        // Círculo com borda preta
        ctx.beginPath();
        ctx.arc(0, 0, this.size/2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else {
        // Tira fina pop
        ctx.fillRect(-this.size/2, -this.size/4, this.size * 1.5, this.size/2);
        ctx.strokeRect(-this.size/2, -this.size/4, this.size * 1.5, this.size/2);
      }

      ctx.restore();
    }
  }

  for (let i = 0; i < 60; i++) {
    particles.push(new PopParticle());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }

  animate();
</script>
</body></html>
