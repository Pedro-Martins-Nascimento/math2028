<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;
        }
        .neo-shadow-lg {
            box-shadow: 6px 6px 0px #000000;
        }
        .neo-shadow-md {
            box-shadow: 4px 4px 0px #000000;
        }
        .neo-shadow-sm {
            box-shadow: 2px 2px 0px #000000;
        }
        .neo-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
        .arcade-dots {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1.5px, transparent 1.5px);
            background-size: 18px 18px;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
        .pulse-win {
            animation: popPulse 0.4s ease-out;
        }
        @keyframes popPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "surface-variant": "#37314c",
          "tile-mint": "#A8FFD6",
          "arcade-cyan": "#00F0FF",
          "tile-master": "#FF9F00",
          "arcade-pink": "#FF3385",
          "background": "#150f28",
          "surface-card": "#251842",
          "arcade-green": "#39FF88",
          "surface-container": "#221c35",
          "arcade-yellow": "#FFE600",
          "surface-container-high": "#2c2640",
          "surface-container-low": "#1e1831",
          "surface-container-lowest": "#100a23",
          "board-bg": "#251545",
          "arcade-orange": "#FF7A00",
          "arcade-purple": "#8A3FFC"
        },
        "fontFamily": {
          "display": ["Fredoka", "sans-serif"],
          "body": ["Plus Jakarta Sans", "sans-serif"]
        }
      }
    }
  }
</script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
</style>
</head>
<body class="bg-[#150f28] text-white font-body antialiased min-h-screen overflow-hidden arcade-dots relative selection:bg-arcade-yellow selection:text-black">
<!-- Background Game Simulation (Blurred) -->
<header class="bg-[#1e1831]/90 border-b-[3px] border-black flex justify-between items-center w-full px-5 py-3 fixed top-0 z-10 backdrop-blur-sm">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-arcade-yellow border-[2.5px] border-black flex items-center justify-center neo-shadow-sm font-display font-black text-black text-xl">
      M
    </div>
<span class="font-display font-extrabold text-2xl tracking-tight text-white drop-shadow-[0_2px_0_#000]">Math2048</span>
</div>
<div class="flex items-center gap-2">
<div class="bg-arcade-pink text-black font-display font-bold text-xs px-3 py-1 rounded-full border-2 border-black neo-shadow-sm uppercase">
      Nível 4
    </div>
<button class="bg-[#2c2640] border-2 border-black p-1.5 rounded-xl neo-shadow-sm text-white">
<span class="material-symbols-outlined text-[20px] block">settings</span>
</button>
</div>
</header>
<main class="flex flex-col items-center justify-center min-h-screen p-4 gap-6 filter blur-[6px] opacity-40 transition-all pointer-events-none select-none">
<!-- HUD Behind -->
<div class="flex justify-between w-full max-w-[360px]">
<div class="bg-[#251842] border-[3px] border-black p-3 rounded-xl neo-shadow-md min-w-[110px]">
<span class="font-display text-[10px] uppercase font-black text-arcade-cyan tracking-wider block">PONTOS</span>
<span class="font-display text-2xl font-bold text-white">12,480</span>
</div>
<div class="bg-[#251842] border-[3px] border-black p-3 rounded-xl neo-shadow-md min-w-[110px] text-right">
<span class="font-display text-[10px] uppercase font-black text-arcade-pink tracking-wider block">RECORD</span>
<span class="font-display text-2xl font-bold text-white">24,512</span>
</div>
</div>
<!-- Board Simulation -->
<div class="bg-board-bg border-[3px] border-black p-3 rounded-2xl grid grid-cols-4 grid-rows-4 w-[330px] h-[330px] gap-2 neo-shadow-lg">
<div class="bg-arcade-yellow text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">2</div>
<div class="bg-arcade-orange text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">4</div>
<div class="bg-[#1a0c33] rounded-xl border-2 border-black/50"></div>
<div class="bg-arcade-yellow text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">2</div>
<div class="bg-arcade-pink text-white font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">8</div>
<div class="bg-arcade-purple text-white font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">16</div>
<div class="bg-arcade-orange text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">4</div>
<div class="bg-[#1a0c33] rounded-xl border-2 border-black/50"></div>
<div class="bg-[#1a0c33] rounded-xl border-2 border-black/50"></div>
<div class="bg-arcade-yellow text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">2</div>
<div class="bg-arcade-pink text-white font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">8</div>
<div class="bg-arcade-orange text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">4</div>
<div class="bg-arcade-yellow text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">2</div>
<div class="bg-[#1a0c33] rounded-xl border-2 border-black/50"></div>
<div class="bg-[#1a0c33] rounded-xl border-2 border-black/50"></div>
<div class="bg-arcade-yellow text-black font-display font-black text-2xl rounded-xl border-2 border-black flex items-center justify-center">2</div>
</div>
</main>
<!-- NEO-BRUTALIST GATEKEEPER MODAL OVERLAY -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#100a23]/85 backdrop-blur-md transition-opacity duration-300" id="gatekeeperModal">
<div class="bg-[#251842] w-full max-w-[390px] rounded-3xl p-5 sm:p-6 flex flex-col items-center gap-4 border-[3.5px] border-black neo-shadow-lg relative overflow-hidden transition-all duration-200" id="modalContent">
<!-- Top Decorative Header Tag -->
<div class="w-full flex items-center justify-between gap-2">
<div class="inline-flex items-center gap-1.5 bg-arcade-yellow text-black px-3.5 py-1.5 rounded-full border-[2.5px] border-black neo-shadow-sm font-display font-black text-xs uppercase tracking-wider">
<span class="material-symbols-outlined text-[16px] leading-none">bolt</span>
<span>DESAFIO GATEKEEPER</span>
</div>
<div class="inline-flex items-center gap-1 bg-arcade-pink text-white px-2.5 py-1 rounded-full border-2 border-black font-display font-black text-[11px] neo-shadow-sm uppercase">
<span>+200 XP</span>
</div>
</div>
<!-- Title & Subtitle -->
<div class="text-center mt-1">
<h2 class="font-display font-black text-2xl text-white tracking-tight drop-shadow-[0_2px_0_#000]">
        Desbloqueie a Fusão!
      </h2>
<p class="text-xs font-body font-semibold text-[#cdc7aa] mt-0.5">
        Resolva para fundir blocos e liberar a matriz
      </p>
</div>
<!-- Vibrant Equation Display Container -->
<div class="w-full bg-arcade-yellow border-[3.5px] border-black rounded-2xl py-5 px-3 flex flex-col items-center justify-center neo-shadow-md relative transform -rotate-[0.5deg]">
<div class="absolute -top-3 left-4 bg-black text-arcade-yellow text-[10px] font-display font-black uppercase px-2 py-0.5 rounded-md border border-arcade-yellow tracking-widest">
        EQUAÇÃO DE 1º GRAU
      </div>
<div class="font-display font-black text-4xl sm:text-5xl text-black tracking-tight select-none mt-1">
        2x + 4 = 10
      </div>
</div>
<!-- Input Display Slot -->
<div class="w-full flex items-center justify-center gap-3">
<div class="font-display font-bold text-sm text-[#e8ddff] uppercase tracking-wide">
        Valor de <span class="text-arcade-cyan font-black text-lg">x</span> =
      </div>
<div class="relative flex-1 max-w-[170px]">
<div class="w-full h-14 bg-[#100a23] border-[3px] border-black rounded-xl neo-shadow-sm flex items-center justify-center font-display font-black text-3xl text-arcade-green tracking-wider" id="displayArea">
<span class="opacity-30 text-white text-2xl" id="placeholderPrompt">?</span>
</div>
<button class="absolute -right-2 -top-2 bg-arcade-pink text-white w-6 h-6 rounded-full border-2 border-black font-black text-xs flex items-center justify-center neo-shadow-sm hover:scale-110 active:scale-95 transition-transform" onclick="clearValue()" title="Limpar">
          ✕
        </button>
</div>
</div>
<!-- Tactile Neo-Brutalist Numeric Keypad -->
<div class="w-full grid grid-cols-4 gap-2 pt-1">
<button class="neo-btn bg-[#37314c] hover:bg-[#463e61] text-white border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('1')">1</button>
<button class="neo-btn bg-[#37314c] hover:bg-[#463e61] text-white border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('2')">2</button>
<button class="neo-btn bg-arcade-cyan text-black border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('3')">3</button>
<button class="neo-btn bg-[#37314c] hover:bg-[#463e61] text-white border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('4')">4</button>
<button class="neo-btn bg-[#37314c] hover:bg-[#463e61] text-white border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('5')">5</button>
<button class="neo-btn bg-[#37314c] hover:bg-[#463e61] text-white border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('6')">6</button>
<button class="neo-btn bg-[#37314c] hover:bg-[#463e61] text-white border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('7')">7</button>
<button class="neo-btn bg-[#37314c] hover:bg-[#463e61] text-white border-[2.5px] border-black rounded-xl py-2.5 font-display font-black text-xl neo-shadow-sm transition-transform" onclick="inputDigit('8')">8</button>
</div>
<!-- Confirm Button -->
<button class="neo-btn w-full mt-1 bg-arcade-green hover:bg-[#2bff7f] text-black font-display font-black text-lg py-3.5 px-4 rounded-2xl border-[3px] border-black neo-shadow-md flex items-center justify-center gap-2 tracking-wide uppercase transition-all duration-150" id="confirmBtn" onclick="validateAnswer()">
<span class="material-symbols-outlined text-[24px]">check_circle</span>
<span id="btnText">CONFIRMAR RESPOSTA</span>
</button>
<!-- Educational Micro-tip -->
<div class="bg-[#100a23]/60 border border-black/40 rounded-xl px-3 py-2 flex items-center gap-2 w-full">
<span class="text-arcade-yellow text-base select-none">💡</span>
<p class="font-body text-[11px] font-semibold text-[#cdc7aa] leading-tight">
<span class="text-arcade-cyan font-bold">Dica:</span> Isole o <span class="text-white font-bold">2x</span> fazendo <span class="text-white font-bold">10 - 4 = 6</span>, depois divida por 2!
      </p>
</div>
</div>
</div>
<!-- Bottom Navigation Shell (Consistent with Screen 2) -->
<nav class="fixed bottom-0 left-0 w-full z-40 flex justify-around items-center px-4 py-2.5 bg-[#100a23] border-t-[3px] border-black">
<button class="flex flex-col items-center justify-center bg-arcade-yellow text-black border-2 border-black rounded-xl px-5 py-1 neo-shadow-sm">
<span class="material-symbols-outlined text-[20px]">videogame_asset</span>
<span class="font-display font-black text-[11px] uppercase">Jogar</span>
</button>
<button class="flex flex-col items-center justify-center text-[#cdc7aa] hover:text-white px-4 py-1">
<span class="material-symbols-outlined text-[20px]">leaderboard</span>
<span class="font-display font-bold text-[11px] uppercase">Ranking</span>
</button>
<button class="flex flex-col items-center justify-center text-[#cdc7aa] hover:text-white px-4 py-1">
<span class="material-symbols-outlined text-[20px]">person</span>
<span class="font-display font-bold text-[11px] uppercase">Conta</span>
</button>
</nav>
<script>
  let currentValue = "3"; // Pre-filled default to match prototype context or interactive use

  function updateDisplay() {
    const displayArea = document.getElementById('displayArea');
    if (!currentValue) {
      displayArea.innerHTML = '<span class="opacity-30 text-white text-2xl" id="placeholderPrompt">?</span>';
    } else {
      displayArea.textContent = currentValue;
    }
  }

  function inputDigit(digit) {
    if (currentValue.length >= 2) {
      currentValue = digit;
    } else {
      currentValue = (currentValue === "" ? "" : currentValue) + digit;
    }
    updateDisplay();
  }

  function clearValue() {
    currentValue = "";
    updateDisplay();
  }

  // Initial render
  updateDisplay();

  function validateAnswer() {
    const modalContent = document.getElementById('modalContent');
    const btn = document.getElementById('confirmBtn');
    const btnText = document.getElementById('btnText');
    const modalOverlay = document.getElementById('gatekeeperModal');
    const mainContent = document.querySelector('main');

    // 2x + 4 = 10 -> x = 3
    if (currentValue === '3') {
      modalContent.classList.remove('shake');
      modalContent.classList.add('pulse-win');
      btn.className = "neo-btn w-full mt-1 bg-arcade-cyan text-black font-display font-black text-lg py-3.5 px-4 rounded-2xl border-[3px] border-black neo-shadow-md flex items-center justify-center gap-2 tracking-wide uppercase transition-all";
      btnText.textContent = '🎉 CORRETO! LIBERANDO...';

      setTimeout(() => {
        modalOverlay.classList.add('opacity-0', 'pointer-events-none');
        mainContent.classList.remove('blur-[6px]', 'opacity-40');
      }, 700);
    } else {
      modalContent.classList.add('shake');
      btn.className = "neo-btn w-full mt-1 bg-arcade-pink text-white font-display font-black text-lg py-3.5 px-4 rounded-2xl border-[3px] border-black neo-shadow-md flex items-center justify-center gap-2 tracking-wide uppercase transition-all";
      btnText.textContent = 'OPS! TENTE NOVAMENTE';

      setTimeout(() => {
        modalContent.classList.remove('shake');
        btn.className = "neo-btn w-full mt-1 bg-arcade-green hover:bg-[#2bff7f] text-black font-display font-black text-lg py-3.5 px-4 rounded-2xl border-[3px] border-black neo-shadow-md flex items-center justify-center gap-2 tracking-wide uppercase transition-all duration-150";
        btnText.textContent = 'CONFIRMAR RESPOSTA';
      }, 1000);
    }
  }

  // Keyboard support for desktop testing
  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') {
      inputDigit(e.key);
    } else if (e.key === 'Backspace') {
      clearValue();
    } else if (e.key === 'Enter') {
      validateAnswer();
    }
  });
</script>
</body></html>
