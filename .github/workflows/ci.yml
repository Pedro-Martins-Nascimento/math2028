name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build:web:prod
      - name: Verificar tamanho do bundle
        run: |
          size=$(stat -c%s www/dist/bundle.js)
          echo "Bundle: ${size} bytes"
          if [ "$size" -gt 1500000 ]; then
            echo "Bundle excedeu 1.5MB — revise dependências antes de aumentar o limite."
            exit 1
          fi
